<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmation Page</title>
</head>
<body>
    Customer Registration is Successful and Confirmed: <span th:text="${customer.firstName +' '+ customer.lastName }" />
    <br><br>
    Free Passes : <span th:text="${customer.freePasses}"/>
    <br><br>
    Postal Code: <span th:text="${customer.postalCode}"/>
    <br><br>
    Course Code: <span th:text="${customer.courseCode}"/>
</body>
</html>
