<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration Form</title>
    <style>
        .error{color:red}
    </style>
</head>
<body>
    <i>Fill out the form. Anything with (*) means required</i>
    <br><br>
    <form th:action="@{/processForm}" th:object="${customer}" method="post">
    <!-- @processForm is where to submit the form data and customer is the model attribute name-->
        First Name: <input type="text" th:field="*{firstName}"/>
        <br><br>
        Last Name(*): <input type="text" th:field="*{lastName}"/>
        <!-- Add error message (if present)-->
        <span th:if="${#fields.hasErrors('lastName')}"
              th:errors="*{lastName}"
              class="error"></span>
        <!--checking if last name field has error message-->
        <!-- display error message for last name-->
        <br><br>

        Free Passes: <input type="text" th:field="*{freePasses}"/>
        <!-- Add Error message-->
        <span th:if="${#fields.hasErrors('freePasses')}"
              th:errors="*{freePasses}"
              class="error"></span>
        <br><br>

        Postal Code: <input type="text" th:field="*{postalCode}"/>
        <!-- Add Error message-->
        <span th:if="${#fields.hasErrors('postalCode')}"
              th:errors="*{postalCode}"
              class="error"></span>
        <br><br>

        Course Code: <input type="text" th:field="*{courseCode}"/>
        <!-- Add Error message-->
        <span th:if="${#fields.hasErrors('courseCode')}"
              th:errors="*{courseCode}"
              class="error"></span>
        <br><br>

        <input type="submit" value="Submit"/>


    </form>


</body>
</html>
