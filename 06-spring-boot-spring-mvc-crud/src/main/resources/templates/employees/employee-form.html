<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Save Employee</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="container">
        <h3>Employee Directory</h3>
        <hr>

        <p class="h4 mb-3">Save Employee</p>

        <form action="#" th:action="@{/employees/save}"
                         th:object="${employee}" method="post">

            <!-- Add hidden form field to handle the update-->
            <input type="hidden" th:field="*{employeeId}">

            <!-- * selects property on referenced th:object-->
            <input type="text" th:field="*{firstName}"
                   class="form-control mb-4 w-23"
                   placeholder="First Name">

            <input type="text" th:field="*{lastName}"
                   class="form-control mb-4 w-23"
                   placeholder="Last Name">

            <input type="text" th:field="*{emailAdd}"
                   class="form-control mb-4 w-23"
                   placeholder="Email">

            <button type="submit" class="btn btn-info col-2">
                Save
            </button>
            <!-- when form is loaded, it calls all the getter methods to populate the fields
            And when the form is submitted it calls all the setter methods to populate java object
             with form data-->

        </form>

        <hr>

        <a th:href="@{/employees/list}">Back to Employees List</a>
    </div>

</body>

</html>
