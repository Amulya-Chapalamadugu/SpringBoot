<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h3>Employee Directory</h3>
        <hr>

        <a th:href="@{/employees/showFormForAdd}" class="btn btn-primary btn-sm mb-3">
            Add Employee
        </a>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <!--<th>Employee Id</th>-->
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
            <tr th:each="tempEmployee:${employees}">
                <!-- <td th:text="${tempEmployee.employeeId}"></td> -->
                <td th:text="${tempEmployee.firstName}"></td>
                <td th:text="${tempEmployee.lastName}"></td>
                <td th:text="${tempEmployee.emailAdd}"></td>
                <!-- Add update button -->
                <td>
                    <a th:href="@{/employees/showFormForUpdate(emplId=${tempEmployee.employeeId})}"
                        class="btn btn-sm btn-info">
                        Update
                    </a>
                    <a th:href="@{/employees/deleteEmployee(emplId=${tempEmployee.employeeId})}"
                        class="btn btn-sm btn-danger"
                        onclick="if(!(confirm('Are you sure you want to delete this employee?'))) return false">
                        <!-- above is the javascript to prompt the user before deleting the employee-->
                        Delete
                    </a>
                </td>
            </tr>

            </tbody>
        </table>
    </div>
    <!-- <span th:text="${employees}"></span>-->
</body>
</html>
