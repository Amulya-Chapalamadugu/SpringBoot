spring.application.name=cruddemo
spring.datasource.url=jdbc:mysql://localhost:3306/student_tracker
spring.datasource.username=springstudent
spring.datasource.password=springstudent
#To turn off spring banner in the console
spring.main.banner-mode=off
#Reducing the logging levels and set to show only the warnings and output
logging.level.root=warn

#Add logging configs to log sql statements
#Log sql statements
logging.level.org.hibernate.SQL = debug
#log values for sql statements
logging.level.org.hibernate.orm.jdbc.bind = trace
#Auto creating tables using ddl
#create will first drop the table if exists and creates a new table
# every time the app is run, it drops the table and creates one
#You will lose any previous data
#spring.jpa.hibernate.ddl-auto=create

#the "update" config will keep all the existing data in the table
spring.jpa.hibernate.ddl-auto=update
